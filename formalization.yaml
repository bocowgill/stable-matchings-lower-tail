# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A quantitative lower-tail bound for random stable matchings"
  description: >-
    In a balanced stable-marriage market of size n, each participant independently
    chooses a uniformly random strict ranking. Write S_n for the number of stable
    complete matchings. For absolute constants C and t_0 greater than zero and
    every fixed 0 < t < t_0, the limit superior as n tends to infinity of
    Pr(S_n <= t n log n) is at most C t^2 log(e/t). Bo Cowgill and Will Cook
    are coauthors of this fixed-threshold result.
  authors:
    - "Bo Cowgill"
  responsible_maintainers:
    - "Bo Cowgill"
  license: "Apache-2.0"

classification:
  arxiv: ["math.CO", "math.PR"]
  msc2020: ["05C70", "60C05"]

sources:
  - title: "How Many Stable Matchings in a Random Market?"
    type: "other"
    relationship: "formalizes"
    location: "Unpublished manuscript, fixed-threshold proposition and appendix Dependence on the lower threshold"
    note: >-
      The manuscript is private. Bo Cowgill and Will Cook are coauthors of the
      fixed-threshold result stated in this proposition.
  - title: "On the Likely Number of Stable Marriages"
    authors: ["Craig Lennon"]
    id: "https://etd.ohiolink.edu/acprod/odb_etd/ws/send_file/send?accession=osu1194991095&disposition=inline"
    location: "The Ohio State University PhD dissertation (2007), §1.2 and Eq. (6.0.1), p. 117"
    type: "other"
    relationship: "background"
    note: "States the qualitative conjecture. Chapter 4 gives a two-matching score integral used in the proof."
  - title: "On the Likely Number of Solutions for the Stable Marriage Problem"
    authors: ["Craig Lennon", "Boris Pittel"]
    id: "https://doi.org/10.1017/S0963548308009607"
    location: "Combinatorics, Probability and Computing 18 (2009), 371–421"
    type: "paper"
    relationship: "background"
    note: "Gives a second-moment estimate and leaves convergence to one open."
  - title: "The Average Number of Stable Matchings"
    authors: ["Boris Pittel"]
    id: "https://doi.org/10.1137/0402048"
    location: "SIAM Journal on Discrete Mathematics 2 (1989), 530–549"
    type: "paper"
    relationship: "background"
    note: "Gives the first-moment asymptotic. The lower-tail proof uses an upper bound of order n log n."

related_formalizations:
  - id: "https://palomar-registry.org/entry.html?id=PALOMAR-2026-11-07-000001&version=3"
    relationship: "builds-on"
    note: >-
      The registered qualitative lower-tail proof supplies the finite model,
      rotation counting, and centered-moment machinery used here.
  - id: "https://github.com/google-deepmind/formal-conjectures/commit/d2b6fdbe08ce4ca17d2c7f328f32c27115f5f6d6"
    relationship: "builds-on"
    note: "Provides the finite StableMarriage model and the formal statement of the qualitative conjecture."

status:
  scope: >-
    The headline concerns complete, strict, independent uniform preferences on
    two sides of equal size. It bounds the closed lower-tail event at the
    n log n scale, for each fixed positive threshold coefficient in an
    absolute neighborhood of zero.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "LennonPittel.fixed_threshold_lower_tail"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "agent"
      framework: "OpenAI Codex"
      tool_setup: >-
        OpenAI Codex assisted with formalizing the manuscript argument in Lean,
        checking the quantitative bounds, and preparing the verification
        package. The development uses Lean 4, Mathlib, and Comparator.
  notes: "A complete model and budget record for the reused proof development is unavailable."

fidelity:
  divergences: >-
    The headline uses the same closed event and quantifier order as the
    manuscript. The Lean model encodes strict rankings by permutations and
    uses the uniform law on the full finite profile type. This is the
    independent uniform preference law in the source.

review:
  status: "agent-reviewed"
  notes: >-
    Codex agents checked the statement against the fixed-threshold proposition,
    including its quantifier order and the equality case in the lower-tail
    event. The Solution built under Lean 4.35.0 with warnings treated as
    errors. The local Comparator run accepted the proof with Lean, NanoDa,
    and con-ron using separate exports on macOS with Comparator's sandbox
    disabled. The v3 Palomar review covers the qualitative conjecture.

alignment:
  namespace: "LennonPittel"
  statements:
    - source: "How Many Stable Matchings in a Random Market?, fixed-threshold proposition"
      lean: "LennonPittel.fixed_threshold_lower_tail"
      module: "Solution"
      status: "proved"
      note: "Challenge states the same declaration independently in the explicit finite model."

acknowledgements: >-
  The stable-marriage model builds on Formal Conjectures and its contributors.
  The quantitative proof builds on the Lean development of the Lennon–Pittel
  conjecture and uses Lean and Mathlib.
